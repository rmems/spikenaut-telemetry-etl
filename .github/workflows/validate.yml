name: validate

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the repo and runs tests. Without an explicit block,
# the job inherits the repository default, which can be read/write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Don't leave the job's credentials in .git/config for later steps.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Latest only. The floor declared in pyproject (>=3.10) is no longer
          # exercised at runtime here -- mypy still type-checks against 3.10, but
          # a 3.10-specific runtime bug would now reach main. That trade is
          # deliberate; the 3.10 leg is what caught the nanosecond-timestamp
          # parse failure, so raise requires-python if the floor stops mattering.
          python-version: "3.14"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests tools

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

      # The pipeline must accept the real fixtures...
      - name: Pipeline accepts valid data
        run: |
          spikenaut-etl validate \
            --input tests/fixtures \
            --reports "$RUNNER_TEMP/reports"

      # ...and must reject each defect that reached production. An exit code of 0
      # here means a gate has regressed and corrupt data could ship again.
      - name: Pipeline rejects known-corrupt data
        run: |
          set +e
          failures=0
          for fixture in all_empty_telemetry all_zero_telemetry fabricated_timestamps; do
            case "$fixture" in
              all_empty_telemetry) key=neuromorphic_data; name=neuromorphic_data.jsonl ;;
              *)                   key=node_sync_harvest; name=node_sync_harvest.jsonl ;;
            esac

            dir="$RUNNER_TEMP/corrupt-$fixture"
            mkdir -p "$dir"
            cp "tests/fixtures/corrupt/$fixture.jsonl" "$dir/$name"

            spikenaut-etl validate --input "$dir" \
              --reports "$RUNNER_TEMP/reports-$fixture" --only "$key"
            status=$?

            if [ $status -eq 0 ]; then
              echo "::error::$fixture was ACCEPTED; a validation gate has regressed"
              failures=$((failures + 1))
            else
              echo "ok: $fixture correctly rejected (exit $status)"
            fi
          done
          exit $failures
