name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  qodana:
    runs-on: ubuntu-latest
    # pr-mode is false and qodana.yaml sets no baseline-commit, so the action
    # neither writes to the repo nor posts PR comments -- it only publishes a
    # check run, which needs `checks: write` alone. `contents: write` and
    # `pull-requests: write` would widen the blast radius of a compromised
    # action or token for no functional gain.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Check out the actual pull request commit, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          # A full history is required for pull request analysis.
          fetch-depth: 0
          # Don't leave the job's credentials in .git/config for later steps.
          persist-credentials: false

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692  # v2026.2.0
        with:
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_574611171 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
