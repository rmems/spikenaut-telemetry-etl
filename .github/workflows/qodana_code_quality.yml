name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  # Community Python only. qodana-python-community does not need Qodana Cloud,
  # so this job runs on Dependabot and fork pull requests as well as ordinary
  # ones. The paid Python linter is gone: it required Ultimate, and that
  # membership has expired.
  qodana:
    name: Qodana (python)
    runs-on: ubuntu-latest
    # pr-mode is false and qodana.yaml sets no baseline-commit, so the action
    # neither writes to the repo nor posts PR comments -- it only publishes a
    # check run, which needs `checks: write` alone. `contents: write` and
    # `pull-requests: write` would widen the blast radius of a compromised
    # action or token for no functional gain.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Check out the actual pull request commit, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          # A full history is required for pull request analysis.
          fetch-depth: 0
          # Don't leave the job's credentials in .git/config for later steps.
          persist-credentials: false

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77  # v2026.2.1
        with:
          pr-mode: false
          # Space-separated, not comma-separated: the action warns that
          # "Comma-separated args format is deprecated and will be removed in a
          # future version."
          args: --config qodana.yaml
        # No QODANA_TOKEN / QODANA_ENDPOINT: Community does not talk to Cloud.
