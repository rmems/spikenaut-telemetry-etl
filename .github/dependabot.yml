version: 2

# The workflow pins actions to commit SHAs, which is what stops a moved tag from
# silently changing what runs in CI. Pinning without automation just trades that
# risk for stale, unpatched actions -- so Dependabot owns keeping the SHAs and
# their version comments current.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
